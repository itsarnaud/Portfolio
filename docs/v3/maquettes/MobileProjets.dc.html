<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projets mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Karla:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}
.press{transition:translate .12s ease,box-shadow .12s ease}
.press:active{translate:3px 3px;box-shadow:0 0 0 #121212 !important}
@keyframes pop{from{opacity:0;translate:0 .55em;rotate:7deg}to{opacity:1;translate:0 0;rotate:0deg}}
.pop{display:inline-block;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rise{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
.rise{animation:rise .8s cubic-bezier(.2,1,.3,1) both}
@keyframes wobble{0%,100%{rotate:-3deg}50%{rotate:2deg}}
.wobble{animation:wobble 2.6s ease-in-out infinite}
@keyframes spin{to{rotate:360deg}}
.spin{animation:spin 6s linear infinite}
.spin-slow{animation:spin 16s linear infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
.fl{animation:float 3.4s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,18,18,.5)}100%{box-shadow:0 0 0 8px rgba(18,18,18,0)}}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes menuin{from{clip-path:circle(0% at 352px 38px)}to{clip-path:circle(150% at 352px 38px)}}
.menuin{animation:menuin .55s cubic-bezier(.6,0,.2,1) both}
@keyframes linkin{from{opacity:0;translate:0 30px;rotate:-4deg}to{opacity:1;translate:0 0;rotate:0deg}}
.linkin{animation:linkin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cin-a{from{opacity:0;translate:0 30px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
@keyframes cin-b{from{opacity:0;translate:0 30px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
.cin-a{animation:cin-a .5s cubic-bezier(.2,1.3,.4,1) both}
.cin-b{animation:cin-b .5s cubic-bezier(.2,1.3,.4,1) both}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.pop,.rise,.wobble,.spin,.spin-slow,.fl,.pulse,.menuin,.linkin,.cin-a,.cin-b{animation:none !important}.press{transition:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 2700px; overflow: hidden; background: #F7F7F2; color: #121212; font-family: 'Karla', system-ui, sans-serif; display: flex; flex-direction: column">

<dc-import name="MobileNav" active="projets" hint-size="390px,64px"></dc-import>

<header style="padding: 36px 16px 20px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: -0.04em; line-height: 0.95"><span class="pop" style="animation-delay: 150ms">Tous</span> <span class="pop" style="animation-delay: 230ms">mes</span> <span class="pop" style="animation-delay: 330ms"><span class="wobble" style="display: inline-block; background: #FF9BD0; border: 2px solid #121212; border-radius: 0.2em; padding: 0 0.12em">projets</span></span></h1>
<p class="rise" style="margin: 0; font-size: 16px; line-height: 1.55; color: #3A3A35; animation-delay: 450ms">Des projets d'alternance, de cours, pour des clients et pour moi. Touche une carte pour voir comment je l'ai construit ;)</p>
</header>

<div class="rise hscroll" role="group" aria-label="Filtrer les projets" style="display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; animation-delay: 550ms">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button type="button" class="press" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border: 2px solid #121212; border-radius: 999px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</sc-for>
</div>
<p style="margin: 6px 16px 14px; display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #4A4A44"><span aria-hidden="true" class="pulse" style="width: 8px; height: 8px; border-radius: 50%; background: #6B3CF0"></span>{{countLabel}}</p>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{visible}}" as="p" hint-placeholder-count="12">
<div class="{{p.cin}}" style="animation-delay: {{p.delay}}">
<a href="MobileProjet.dc.html" class="press" style="display: flex; gap: 14px; align-items: stretch; padding: 12px; background: #FFFFFF; border: 2px solid #121212; border-radius: 20px; box-shadow: 4px 4px 0 #121212; text-decoration: none; color: #121212">
<div style="flex: 0 0 92px; height: 100px; box-sizing: border-box; border: 2px solid #121212; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; background: {{p.bg}}; color: {{p.fg}}">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600">{{p.n}}</span>
<span style="height: 34px; border: 1.5px solid #121212; border-radius: 7px; background: {{p.screen}}"></span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; line-height: 1.05">{{p.title}}</span>
<span style="font-size: 14px; line-height: 1.4; color: #3A3A35">{{p.desc}}</span>
<span style="margin-top: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600; color: #4A4A44">{{p.type}} · {{p.year}}</span>
</div>
</a>
</div>
</sc-for>
</div>

<div style="margin-top: auto">
<dc-import name="MobileFooter" hint-size="390px,640px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.state || {};
    var filter = st.filter || "all";
    var anim = st.anim || 0;
    var self = this;
    var ink = "#121212";
    var light = "rgba(0,0,0,0.08)";
    var dark = "rgba(255,255,255,0.2)";
    var projects = [
      { n: "N°12", year: "2026", type: "Mobile", group: "mobile", title: "Tengo!", desc: "Le Killer entre potes : l'appli tire les cibles et compte les kills.", bg: "#FF5B37", fg: ink, screen: light },
      { n: "N°11", year: "2026", type: "Fullstack", group: "full", title: "Quested", desc: "Le Letterboxd des jeux vidéo.", bg: "#6B3CF0", fg: "#FFFFFF", screen: dark },
      { n: "N°10", year: "2026", type: "Backend", group: "back", title: "FutureKawa", desc: "Une API qui suit des stocks de café, avec de l'IoT.", bg: "#C8F54A", fg: ink, screen: light },
      { n: "N°9", year: "2026", type: "Frontend", group: "front", title: "Atelier Maha", desc: "Le site d'un studio d'architecture d'intérieur.", bg: "#FFCB3D", fg: ink, screen: light },
      { n: "N°8", year: "2026", type: "Frontend", group: "front", title: "IDK Concept", desc: "Un site vitrine pour une entreprise d'agencement.", bg: "#FF9BD0", fg: ink, screen: light },
      { n: "N°7", year: "2026", type: "Fullstack", group: "full", title: "Kollirama", desc: "Site vitrine en trois langues et back-office.", bg: "#2E5BFF", fg: "#FFFFFF", screen: dark },
      { n: "N°6", year: "2025", type: "Fullstack", group: "full", title: "Igotrack", desc: "Une appli web de gestion de projet.", bg: "#FFFFFF", fg: ink, screen: light },
      { n: "N°5", year: "2025", type: "Bot Discord", group: "back", title: "Stellarica", desc: "Un bot de modération pour Discord.", bg: "#FF5B37", fg: ink, screen: light },
      { n: "N°4", year: "2025", type: "Fullstack", group: "full", title: "Foliode", desc: "Un générateur de portfolio en ligne.", bg: "#FFCB3D", fg: ink, screen: light },
      { n: "N°3", year: "2024", type: "Frontend", group: "front", title: "Igowall", desc: "Une plateforme no-code pour créer son site.", bg: "#6B3CF0", fg: "#FFFFFF", screen: dark },
      { n: "N°2", year: "2024", type: "Open source", group: "oss", title: "Template Bench", desc: "Un benchmark des moteurs de template JS.", bg: "#C8F54A", fg: ink, screen: light },
      { n: "N°1", year: "2024", type: "Open source", group: "oss", title: "Tiptap FontSize", desc: "Une extension Tiptap publiée sur npm.", bg: "#FF9BD0", fg: ink, screen: light }
    ];
    var defs = [{ id: "all", label: "Tout" }, { id: "full", label: "Fullstack" }, { id: "front", label: "Front" }, { id: "back", label: "Back" }, { id: "mobile", label: "Mobile" }, { id: "oss", label: "Open source" }];
    var cin = anim % 2 ? "cin-b" : "cin-a";
    var visible = (filter === "all" ? projects : projects.filter(function (p) { return p.group === filter; })).map(function (p, i) {
      return Object.assign({}, p, { cin: cin, delay: (i * 50) + "ms" });
    });
    return {
      filters: defs.map(function (d) {
        var on = d.id === filter;
        return { label: d.label, pressed: on ? "true" : "false", bg: on ? ink : "#FFFFFF", fg: on ? "#F7F7F2" : ink, pick: function () { if (!on) { self.setState({ filter: d.id, anim: anim + 1 }); } } };
      }),
      visible: visible,
      countLabel: visible.length + (visible.length > 1 ? " projets" : " projet")
    };
  }
}
</script>
</body>
</html>

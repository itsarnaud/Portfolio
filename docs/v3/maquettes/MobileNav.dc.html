<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Karla:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; font-family: 'Karla', system-ui, sans-serif; color: #121212">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
<a href="MobileAccueil.dc.html" style="display: flex; align-items: center; gap: 10px; color: #121212; text-decoration: none; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.03em">
<span aria-hidden="true" style="position: relative; width: 28px; height: 34px">
<span style="position: absolute; inset: 0; background: #6B3CF0; border: 2px solid #121212; border-radius: 8px; box-shadow: 2px 2px 0 #121212; transform: rotate(-6deg); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 16px; letter-spacing: -0.07em">ar</span>
<svg class="spin" viewBox="0 0 24 24" style="position: absolute; right: -7px; top: -7px; width: 14px; height: 14px"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#C8F54A" stroke="#121212" stroke-width="1.8" stroke-linejoin="round"></path></svg>
</span>
arnaud royer
</a>
<button type="button" class="press" onClick="{{openMenu}}" aria-label="Ouvrir le menu" aria-expanded="{{expanded}}" style="width: 48px; height: 48px; border: 2px solid #121212; border-radius: 14px; background: #FFFFFF; box-shadow: 3px 3px 0 #121212; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
<span aria-hidden="true" style="width: 20px; height: 2.5px; border-radius: 2px; background: #121212"></span>
<span aria-hidden="true" style="width: 20px; height: 2.5px; border-radius: 2px; background: #121212"></span>
<span aria-hidden="true" style="width: 12px; height: 2.5px; border-radius: 2px; background: #121212; align-self: flex-end; margin-right: 12px"></span>
</button>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div class="menuin" role="dialog" aria-modal="true" aria-label="Menu" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; background: #6B3CF0; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; z-index: 50; overflow: hidden">
<div aria-hidden="true" class="spin-slow" style="position: absolute; right: -60px; bottom: 120px; width: 180px; height: 180px; border-radius: 40px; background: #FF5B37; border: 2px solid #121212"></div>
<div aria-hidden="true" class="fl" style="position: absolute; left: -50px; bottom: -50px; width: 170px; height: 170px; border-radius: 50%; background: #C8F54A; border: 2px solid #121212"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.03em">arnaud royer</span>
<button type="button" class="press" onClick="{{closeMenu}}" aria-label="Fermer le menu" style="width: 48px; height: 48px; border: 2px solid #121212; border-radius: 14px; background: #FFFFFF; color: #121212; box-shadow: 3px 3px 0 #121212; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<nav aria-label="Navigation principale" style="position: relative; margin-top: 44px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="6">
<a href="{{l.href}}" class="linkin" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; color: #FFFFFF; text-decoration: none; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -0.04em; line-height: 1; animation-delay: {{l.delay}}">
<span style="display: inline-block; padding: 0 0.12em; border-radius: 0.18em; border: {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; rotate: {{l.rot}}">{{l.label}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; opacity: 0.85">{{l.n}}</span>
</a>
</sc-for>
</nav>
<div style="position: relative; margin-top: auto; display: flex; gap: 10px">
<a href="https://www.linkedin.com/in/royer-arnaud/" class="press" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; background: #FFFFFF; color: #121212; border: 2px solid #121212; border-radius: 14px; box-shadow: 3px 3px 0 #121212; font-weight: 700; text-decoration: none">LinkedIn</a>
<a href="https://github.com/itsarnaud" class="press" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; background: #FFFFFF; color: #121212; border: 2px solid #121212; border-radius: 14px; box-shadow: 3px 3px 0 #121212; font-weight: 700; text-decoration: none">GitHub</a>
<button type="button" class="press" aria-label="Passer le site en anglais" style="min-width: 64px; min-height: 48px; background: #C8F54A; color: #121212; border: 2px solid #121212; border-radius: 14px; box-shadow: 3px 3px 0 #121212; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600">EN</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","projets","blog","apropos","parcours","contact"],"default":"home"},"menuOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var active = this.props.active || "home";
    var open = typeof s.menu === "boolean" ? s.menu : !!this.props.menuOpen;
    var ink = "#121212";
    var defs = [
      { id: "home", label: "Accueil", href: "MobileAccueil.dc.html" },
      { id: "projets", label: "Projets", href: "MobileProjets.dc.html" },
      { id: "blog", label: "Blog", href: "MobileBlog.dc.html" },
      { id: "apropos", label: "À propos", href: "MobileAPropos.dc.html" },
      { id: "parcours", label: "Parcours", href: "MobileParcours.dc.html" },
      { id: "contact", label: "Contact", href: "MobileContact.dc.html" }
    ];
    var rots = ["-2deg", "1deg", "-1deg", "2deg", "-1deg", "1deg"];
    return {
      open: open,
      expanded: open ? "true" : "false",
      openMenu: function () { self.setState({ menu: true }); },
      closeMenu: function () { self.setState({ menu: false }); },
      links: defs.map(function (d, i) {
        var on = d.id === active;
        return { label: d.label, href: d.href, n: "0" + (i + 1), delay: (150 + i * 60) + "ms", bg: on ? "#C8F54A" : "transparent", fg: on ? ink : "#FFFFFF", border: on ? "2px solid #121212" : "2px solid transparent", rot: on ? rots[i] : "0deg" };
      })
    };
  }
}
</script>
</body>
</html>

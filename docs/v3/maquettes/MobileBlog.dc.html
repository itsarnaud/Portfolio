<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Blog mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Karla:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}
.press{transition:translate .12s ease,box-shadow .12s ease}
.press:active{translate:3px 3px;box-shadow:0 0 0 #121212 !important}
@keyframes pop{from{opacity:0;translate:0 .55em;rotate:7deg}to{opacity:1;translate:0 0;rotate:0deg}}
.pop{display:inline-block;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rise{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
.rise{animation:rise .8s cubic-bezier(.2,1,.3,1) both}
@keyframes wobble{0%,100%{rotate:-3deg}50%{rotate:2deg}}
.wobble{animation:wobble 2.6s ease-in-out infinite}
@keyframes spin{to{rotate:360deg}}
.spin{animation:spin 6s linear infinite}
.spin-slow{animation:spin 14s linear infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
.fl{animation:float 3.4s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,18,18,.5)}100%{box-shadow:0 0 0 8px rgba(18,18,18,0)}}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes menuin{from{clip-path:circle(0% at 352px 38px)}to{clip-path:circle(150% at 352px 38px)}}
.menuin{animation:menuin .55s cubic-bezier(.6,0,.2,1) both}
@keyframes linkin{from{opacity:0;translate:0 30px;rotate:-4deg}to{opacity:1;translate:0 0;rotate:0deg}}
.linkin{animation:linkin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cin-a{from{opacity:0;translate:0 30px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
@keyframes cin-b{from{opacity:0;translate:0 30px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
.cin-a{animation:cin-a .5s cubic-bezier(.2,1.3,.4,1) both}
.cin-b{animation:cin-b .5s cubic-bezier(.2,1.3,.4,1) both}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.pop,.rise,.wobble,.spin,.spin-slow,.fl,.pulse,.menuin,.linkin,.cin-a,.cin-b{animation:none !important}.press{transition:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 2800px; overflow: hidden; background: #F7F7F2; color: #121212; font-family: 'Karla', system-ui, sans-serif; display: flex; flex-direction: column">

<dc-import name="MobileNav" active="blog" hint-size="390px,64px"></dc-import>

<header style="padding: 36px 16px 20px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: -0.04em; line-height: 0.95"><span class="pop" style="animation-delay: 150ms">Le</span> <span class="pop" style="animation-delay: 260ms"><span class="wobble" style="display: inline-block; background: #C8F54A; border: 2px solid #121212; border-radius: 0.2em; padding: 0 0.12em">blog</span></span></h1>
<p class="rise" style="margin: 0; font-size: 16px; line-height: 1.55; color: #3A3A35; animation-delay: 400ms">J'écris surtout sur LinkedIn. Je range mes posts ici pour les retrouver : mes projets, l'IA dans le métier de dev, et parfois un peu d'actu ;)</p>
</header>

<div class="rise hscroll" role="group" aria-label="Filtrer par sujet" style="display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; animation-delay: 500ms">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" class="press" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border: 2px solid #121212; border-radius: 999px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</sc-for>
</div>
<p style="margin: 6px 16px 18px; display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #4A4A44"><span aria-hidden="true" class="pulse" style="width: 8px; height: 8px; border-radius: 50%; background: #C8F54A; border: 1px solid #121212"></span>{{countLabel}}</p>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{visible}}" as="p" hint-placeholder-count="8">
<div class="{{p.cin}}" style="animation-delay: {{p.delay}}">
<a href="https://www.linkedin.com/in/royer-arnaud/" class="press" style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 2px solid #121212; border-radius: 22px; box-shadow: 4px 4px 0 #121212; text-decoration: none; background: {{p.bg}}; color: {{p.fg}}">
<sc-if value="{{p.first}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; right: 14px; top: -30px; width: 84px; height: 84px">
<svg class="spin-slow" viewBox="0 0 200 200" style="width: 100%; height: 100%">
<defs><path id="mblog-ring" d="M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0"></path></defs>
<circle cx="100" cy="100" r="97" fill="#FFFFFF" stroke="#121212" stroke-width="3"></circle>
<text style="font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600" fill="#121212"><textPath href="#mblog-ring" textLength="440" lengthAdjust="spacing">DERNIER POST · DERNIER POST · </textPath></text>
</svg>
</span>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600">
<span>{{p.date}}</span>
<span style="padding: 2px 9px; border: 1.5px solid currentColor; border-radius: 999px">{{p.cat}}</span>
</div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; font-size: {{p.titleSize}}">{{p.title}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{p.excerpt}}</p>
<span style="display: inline-flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 2px dashed currentColor; font-weight: 700; font-size: 15px">Lire sur LinkedIn
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
</span>
</a>
</div>
</sc-for>
</div>

<div style="margin-top: auto">
<dc-import name="MobileFooter" hint-size="390px,640px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2800}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.state || {};
    var filter = st.filter || "all";
    var anim = st.anim || 0;
    var self = this;
    var ink = "#121212";
    var cats = {
      societe: { label: "Société", bg: "#FFCB3D", fg: ink },
      ia: { label: "IA", bg: "#2E5BFF", fg: "#FFFFFF" },
      projets: { label: "Mes projets", bg: "#6B3CF0", fg: "#FFFFFF" },
      freelance: { label: "Freelance", bg: "#C8F54A", fg: ink }
    };
    var posts = [
      { cat: "societe", date: "26 août 2026", title: "Réseaux sociaux et mineurs : le Conseil constitutionnel censure la loi", excerpt: "La loi interdisant les réseaux sociaux aux moins de 15 ans a été censurée, faute de garanties sur la vie privée." },
      { cat: "freelance", date: "4 août 2026", title: "Figma, Canva Code 2.0... le no-code n'a jamais été aussi puissant", excerpt: "Est-ce que ces outils remplacent vraiment un site sur mesure ?" },
      { cat: "projets", date: "3 août 2026", title: "Petit update sur Quested : liaison de compte Steam", excerpt: "On peut importer sa bibliothèque Steam, son temps de jeu et ses succès." },
      { cat: "projets", date: "29 juillet 2026", title: "Quested, mon tracker de jeux vidéo façon Letterboxd", excerpt: "Un site pour suivre les jeux vidéo auxquels on joue." },
      { cat: "societe", date: "28 juillet 2026", title: "Réseaux sociaux interdits aux moins de 15 ans : une bonne idée qui m'interroge", excerpt: "Comment vérifier l'âge de tout le monde sans exposer les données de tout le monde ?" },
      { cat: "ia", date: "25 juillet 2026", title: "WebDev Arena : le classement des IA n'a jamais été aussi serré", excerpt: "Des modèles d'IA notés à l'aveugle sur des tâches de dev web." },
      { cat: "freelance", date: "28 mai 2026", title: "Lancement du nouveau site de l'Atelier Maha", excerpt: "Mon premier projet en freelance est en ligne." },
      { cat: "ia", date: "28 février 2026", title: "« Le métier de développeur est foutu, passe sur Replit »", excerpt: "On m'a conseillé de tout refaire avec Replit et l'IA. Vraiment ?" }
    ];
    var defs = [{ id: "all", label: "Tout" }, { id: "projets", label: "Mes projets" }, { id: "ia", label: "IA" }, { id: "freelance", label: "Freelance" }, { id: "societe", label: "Société" }];
    var cin = anim % 2 ? "cin-b" : "cin-a";
    var list = filter === "all" ? posts : posts.filter(function (p) { return p.cat === filter; });
    var visible = list.map(function (p, i) {
      var c = cats[p.cat];
      var first = i === 0;
      return { date: p.date, title: p.title, excerpt: p.excerpt, cat: c.label, first: first, cin: cin, delay: (i * 60) + "ms", bg: first ? c.bg : "#FFFFFF", fg: first ? c.fg : ink, titleSize: first ? "30px" : "22px" };
    });
    return {
      filters: defs.map(function (d) {
        var on = d.id === filter;
        return { label: d.label, pressed: on ? "true" : "false", bg: on ? ink : "#FFFFFF", fg: on ? "#F7F7F2" : ink, pick: function () { if (!on) { self.setState({ filter: d.id, anim: anim + 1 }); } } };
      }),
      visible: visible,
      countLabel: visible.length + (visible.length > 1 ? " posts" : " post")
    };
  }
}
</script>
</body>
</html>
